plugins {
      id 'com.android.application'
      id 'com.google.gms.google-services'
  }

  android {
      namespace 'com.videviewer'
      compileSdk 34

      defaultConfig {
          applicationId "com.videviewer"
          minSdk 21
          targetSdk 34
          versionCode 3
          versionName "3.0.0"
          testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
          multiDexEnabled true
      }

      buildTypes {
          release {
              minifyEnabled true
              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              signingConfig signingConfigs.debug
          }
          debug {
              debuggable true
          }
      }

      compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
      }

      buildFeatures {
          viewBinding true
          buildConfig true
      }

      packagingOptions {
          jniLibs {
              useLegacyPackaging true
          }
      }
  }

  dependencies {
      implementation 'androidx.appcompat:appcompat:1.6.1'
      implementation 'com.google.android.material:material:1.11.0'
      implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
      implementation 'androidx.recyclerview:recyclerview:1.3.2'
      implementation 'androidx.cardview:cardview:1.0.0'
      implementation 'androidx.viewpager2:viewpager2:1.0.0'
      implementation 'androidx.multidex:multidex:2.0.1'
      implementation 'androidx.fragment:fragment:1.6.2'
      implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
      implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
      implementation 'androidx.work:work-runtime:2.9.0'

      // ExoPlayer with FFmpeg
      implementation 'androidx.media3:media3-exoplayer:1.2.1'
      implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
      implementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
      implementation 'androidx.media3:media3-ui:1.2.1'
      implementation 'androidx.media3:media3-session:1.2.1'
      implementation 'androidx.media3:media3-common:1.2.1'
      implementation 'com.github.anilbeesetti.nextlib:nextlib-media3ext:0.8.0'
      implementation 'com.github.anilbeesetti.nextlib:nextlib-mediainfo:0.8.0'

      // Room Database
      implementation 'androidx.room:room-runtime:2.6.1'
      annotationProcessor 'androidx.room:room-compiler:2.6.1'
      implementation 'androidx.room:room-ktx:2.6.1'

      // Glide
      implementation 'com.github.bumptech.glide:glide:4.16.0'
      annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

      // Gson
      implementation 'com.google.code.gson:gson:2.10.1'

      // OkHttp for downloads
      implementation 'com.squareup.okhttp3:okhttp:4.12.0'

      // AdMob
      implementation 'com.google.android.gms:play-services-ads:23.0.0'

      // Cast
      implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'

      // Dots indicator
      implementation 'com.tbuonomo:dotsindicator:5.0'

      testImplementation 'junit:junit:4.13.2'
      androidTestImplementation 'androidx.test.ext:junit:1.1.5'
      androidTestImplementation 'androidx.espresso:espresso-core:3.5.1'
  }