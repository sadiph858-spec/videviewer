name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Sign Release APK
        if: false
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Collect APK files
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/VidViewer-v1.0.6-debug.apk" || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release_apks/VidViewer-v1.0.6-release-unsigned.apk" 2>/dev/null || true
          ls -lh release_apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-Debug-APK
          path: release_apks/VidViewer-v1.0.6-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-Release-APK
          path: release_apks/VidViewer-v1.0.6-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.6
          name: "VidViewer v1.0.6 - Android 5.0+ Compatible"
          body: |
            ## v1.0.6 - Android 5.0+ Compatibility Fix
            - **minSdk lowered from 26 to 21** — app now installs on Android 5.0+ devices
            - **Universal APK** — `splits.abi.enable false` + all 4 ABI filters included in one file
            - No more "App not installed" errors on older or 32-bit devices
          files: release_apks/*.apk
          draft: false
          prerelease: false

      - name: Build Summary
        run: |
          echo "Build Complete!"
          ls -lh release_apks/ 2>/dev/null || echo "No APK files found"
