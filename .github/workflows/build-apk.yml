name: Build Release APK v3.0.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Locate and copy APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs -name '*.apk' -not -path '*/test/*' | head -1)
          if [ -z "$APK" ]; then echo 'ERROR: No APK found!'; exit 1; fi
          echo "Copying: $APK"
          cp "$APK" output/VidViewer-v3.0.0.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-v3.0.0-release
          path: output/VidViewer-v3.0.0.apk
          retention-days: 30

      - name: Create or update release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="output/VidViewer-v3.0.0.apk"
          TAG="v3.0.0"

          # Delete old asset if it exists on the release
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG \
            --jq '.assets[] | select(.name == "VidViewer-v3.0.0.apk") | .id' 2>/dev/null || true)
          if [ -n "$ASSET_ID" ]; then
            gh api --method DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID
            echo "Deleted old asset $ASSET_ID"
          fi

          # Ensure the release exists; create if missing
          if ! gh release view $TAG --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release create $TAG \
              --repo ${{ github.repository }} \
              --title "VidéViewer v3.0.0" \
              --notes "Download fix + Legal pages" \
              --latest
          fi

          # Upload the APK
          gh release upload $TAG "$APK_PATH" \
            --repo ${{ github.repository }} \
            --clobber
          echo "✅ APK uploaded to release $TAG"
