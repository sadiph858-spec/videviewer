name: Build Release APK v4.0.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Locate and copy APK
        run: |
          echo '=== APK outputs ==='
          find . -name '*.apk' -not -path '*/test/*' 2>/dev/null || true
          mkdir -p output
          APK=$(find app/build/outputs -name '*.apk' -not -path '*/test/*' | head -1)
          if [ -z "$APK" ]; then echo 'ERROR: No APK found!'; exit 1; fi
          echo "Copying: $APK"
          cp "$APK" output/VidViewer-v4.0.0.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-v4.0.0-release
          path: output/VidViewer-v4.0.0.apk
          retention-days: 30

      - name: Create GitHub Release v4.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "VidéViewer v4.0.0"
          body: |
            ## VidéViewer v4.0.0

            ### Bug Fixes
            - Fixed `var` keyword Java 8 compatibility in RecentFragment
            - Fixed theme type mismatch (String vs int) between VidViewerApp and SettingsActivity/ThemeHelper
            - Fixed intent extra key inconsistency for video title across fragments
            - Added `EXTRA_RESUME_POSITION` constant to AppConstants

            ### New Features
            - **Resume Position**: Player now saves resume position on pause/stop to Room DB
            - **Resume Snackbar**: "Resume from X:XX?" snackbar shown when re-opening a video
            - Watch count tracking improved (increments on each play)
            - Better null safety throughout PlayerActivity
          files: output/VidViewer-v4.0.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
