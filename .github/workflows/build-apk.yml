name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Get version from build.gradle
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Collect APK files
        run: |
          mkdir -p release_apks
          VER=${{ steps.version.outputs.version }}
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release_apks/VidViewer-v${VER}-debug.apk" 2>/dev/null || true
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" \
             "release_apks/VidViewer-v${VER}-release.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "release_apks/VidViewer-v${VER}-unsigned.apk" 2>/dev/null || true
          ls -lh release_apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-APKs
          path: release_apks/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VidViewer v${{ steps.version.outputs.version }}"
          body: |
            ## VidViewer v${{ steps.version.outputs.version }}

            ### What's New
            - Browser-like in-app video download (DownloadManager)
            - Download option in video context menu
            - WebView with download listener
            - Private Vault, PiP, Gesture controls
            - Material You themes, Bangla/English

            ### Install
            1. Download the APK below
            2. Enable "Install unknown apps" in Settings
            3. Install and enjoy!

            > Requires Android 8.0 (API 26)+
          files: release_apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
