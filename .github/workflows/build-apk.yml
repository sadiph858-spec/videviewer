name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using secret google-services.json"
          else
            echo "Using placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Sign Release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Collect APK files
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk              "release_apks/VidViewer-v1.0.0-debug.apk" || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk              "release_apks/VidViewer-v1.0.0-release-unsigned.apk" 2>/dev/null || true
          ls -lh release_apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-Debug-APK
          path: release_apks/VidViewer-v1.0.0-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-Release-APK
          path: release_apks/VidViewer-v1.0.0-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "VidViewer v1.0.1 - Crash Fixes"
          body: |
            ### v1.0.1 Crash Fixes
            - Fixed NPE crashes in SplashActivity, MainActivity, PlayerActivity
            - AdMob init wrapped in try-catch (prevents crash with placeholder google-services.json)
            - ThemeHelper dynamic colors safe cast
            - All critical null checks added
            ## VidViewer v1.0.0 - Premium Android Video Player
            - ExoPlayer-powered playback
            - Private Vault with PIN/Password protection
            - Material Design 3, Light/Dark/Dynamic themes
            - English & Bangla language support
            - AdMob integration
            - Picture-in-Picture, Gesture controls
            - Sleep timer, Playback speed control
            - Folder browser, Favorites, Watch history, Playlists
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "Build Complete!"
          ls -lh release_apks/ 2>/dev/null || echo "No APK files found"
