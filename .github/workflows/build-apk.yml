name: Build Release APK v3.0.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || (tail -200 build.log && exit 1)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Locate and copy APK
        run: |
          echo '=== All APK outputs ==='
          find . -name '*.apk' -not -path '*/test/*' 2>/dev/null
          echo '=== Release dir contents ==='
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo 'release dir not found'
          mkdir -p output
          APK=$(find app/build/outputs -name '*.apk' -not -path '*/test/*' | head -1)
          if [ -z "$APK" ]; then echo 'ERROR: No APK found!'; exit 1; fi
          echo "Found APK: $APK"
          cp "$APK" output/VidViewer-v3.0.0.apk
          ls -la output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-v3.0.0-release
          path: output/VidViewer-v3.0.0.apk
          retention-days: 30

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: output/VidViewer-v3.0.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
