name: Build Release APK v3.0.0

  on:
    push:
      branches: [ main, master ]
    workflow_dispatch:

  jobs:
    build:
      name: Build Release APK
      runs-on: ubuntu-latest
      permissions:
        contents: write

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: gradle

        - name: Setup Android SDK
          uses: android-actions/setup-android@v3

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        - name: Cache Gradle
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        - name: Build Release APK (debug-signed)
          run: ./gradlew assembleRelease --no-daemon --stacktrace
          env:
            GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

        - name: Rename APK
          run: |
            mkdir -p output
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} output/VidViewer-v3.0.0.apk \;
            ls -la output/

        - name: Upload APK as Artifact
          uses: actions/upload-artifact@v4
          with:
            name: VidViewer-v3.0.0-release
            path: output/VidViewer-v3.0.0.apk
            retention-days: 30

        - name: Upload APK to Release v3.0.0
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v3.0.0
            files: output/VidViewer-v3.0.0.apk
            fail_on_unmatched_files: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  