name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Collect APK files
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk \
             release_apks/VidViewer-v1.0.0-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             release_apks/VidViewer-v1.0.0-unsigned.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk \
             release_apks/VidViewer-v1.0.0-signed.apk 2>/dev/null || true
          ls -lh release_apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidViewer-APKs
          path: release_apks/*.apk
          retention-days: 90

      - name: Delete old v1.0.0 release
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.0" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ] && [ "$RELEASE_ID" != "" ]; then
            curl -s -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" || true
            echo "Deleted old release $RELEASE_ID"
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git push --delete origin v1.0.0 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VidViewer v1.0.0"
          body: |
            ## VidViewer v1.0.0 — Premium Android Video Player

            ### What's New
            - In-app video download (browser-like, DownloadManager)
            - Download option in video long-press menu
            - WebView with download listener
            - Private Vault (PIN/Password/Pattern)
            - Picture-in-Picture, Gesture controls
            - Material You themes, Bangla/English
            - AdMob ads, Sleep timer, Playback speed

            ### Install
            1. Download **VidViewer-v1.0.0-debug.apk** below
            2. Enable **Install unknown apps** in Android Settings
            3. Install and enjoy!

            > Requires Android 8.0 (API 26)+
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
